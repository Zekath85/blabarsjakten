const ICONS = {"ph-drop-slash":"💧","ph-fish":"🐟","ph-plant":"🌱","ph-snowflake":"❄️","ph-thermometer-hot":"🌋","ph-flask":"🧪","ph-fire":"🔥","ph-spiral":"🌀","ph-puzzle-piece":"🧩","ph-x":"✕","ph-paint-brush-broad":"🖌️","ph-star":"⭐","ph-squares-four":"🧩","ph-arrow-right":"➡️"};
const ico = cls => ICONS[String(cls).split(' ').pop()] || '';
const CAT_PICS = { 'Natur':'🌳', 'Varmt':'🔥', 'Magi':'🪄', 'Färger':'🎨' };
const regions = {};
let handlers = {};
const lastHtml = {};

function paint(name, html){
  if (lastHtml[name] === html) return;
  lastHtml[name] = html;
  const el = regions[name];
  const scroll = {};
  el.querySelectorAll('[data-scroll]').forEach(n => { scroll[n.dataset.scroll] = n.scrollLeft; });
  const focused = el.contains(document.activeElement) ? document.activeElement.dataset.h : null;
  el.innerHTML = html;
  el.querySelectorAll('[data-scroll]').forEach(n => { if (scroll[n.dataset.scroll]) n.scrollLeft = scroll[n.dataset.scroll]; });
  if (focused){ const f = el.querySelector('[data-h="' + focused + '"]'); if (f) f.focus({ preventScroll: true }); }
}

function render(){
  const v = app.renderVals();
  const next = {};
  let region = '', n = 0;
  const on = fn => { const id = region + ':' + (n++); next[id] = fn; return 'data-h="' + id + '"'; };
  const start = name => { region = name; n = 0; };
  const tool = (fn, label, icon, style, labelColor) =>
    '<button type="button" class="tool" ' + on(fn) + ' aria-label="' + esc(label) + '" style="' + style + '">' +
    (TOOL_PICS[label]
      ? '<span class="pic" aria-hidden="true" style="font-size:34px;color:inherit">' + TOOL_PICS[label] + '</span>'
      : '<span class="pic" aria-hidden="true">' + ico(icon) + '</span><span' + (labelColor ? ' style="color:' + labelColor + '"' : '') + '>' + esc(label) + '</span>') + '</button>';

  start('hud');
  paint('hud', !v.inLevel ? '' :
    '<div style="position:absolute;top:12px;left:80px;right:12px;display:flex;justify-content:center;pointer-events:none">' +
    '<div style="display:flex;align-items:center;gap:14px;max-width:560px;width:100%;padding:12px 16px;border-radius:var(--radius-lg);background:color-mix(in srgb, var(--color-neutral-900) 88%, transparent);border:1px solid var(--color-neutral-700);box-shadow:var(--shadow-md)">' +
    '<div style="width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb, ' + v.lvTint + ' 26%, transparent);color:' + v.lvTint + '"><span class="pic" aria-hidden="true" style="font-size:28px">' + ico(v.lvIcon) + '</span></div>' +
    '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">' +
    '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' +
    '<span style="font-family:var(--font-heading);font-size:18px;font-weight:500">' + esc(v.lvName) + '</span>' +
    '<span style="font-size:14px;color:var(--color-neutral-300)">' + esc(v.lvText) + '</span></div>' +
    '<div style="height:12px;border-radius:999px;background:var(--color-neutral-800);overflow:hidden">' +
    '<div style="height:100%;width:' + v.progPct + ';border-radius:999px;background:' + v.lvTint + ';transition:width .4s"></div>' +
    '</div></div></div></div>');

  start('rail');
  paint('rail',
    tool(v.levelBtn, v.levelBtnLabel, v.levelBtnIcon, 'border:3px solid var(--color-accent);background:color-mix(in srgb, var(--color-accent) 18%, transparent)', 'var(--color-neutral-200)') +
    '<div class="rule"></div>' +
    v.sizes.map(z => '<button type="button" ' + on(z.pick) + ' aria-label="' + esc(z.label) + '" style="width:64px;height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:var(--radius-lg);border:3px solid ' + z.border + ';background:' + z.bg + '"><span style="width:' + z.dot + ';height:' + z.dot + ';border-radius:50%;background:var(--color-text)"></span></button>').join('') +
    '<div class="rule"></div>' +
    tool(v.toggleMode, v.modeLabel, v.modeIcon, 'border:3px solid var(--color-neutral-700);background:transparent') +
    (v.showEraser ? tool(v.pickEraser, 'Sudda', 'ph-fill ph-eraser', 'border:3px solid ' + v.eraserBorder + ';background:' + v.eraserBg) : '') +
    tool(v.undo, 'Ångra', 'ph-bold ph-arrow-counter-clockwise', 'border:3px solid var(--color-neutral-700);background:transparent;color:' + v.undoColor + (v.undoColor.includes('600') ? ';--pic-o:.35' : '')) +
    tool(v.togglePause, v.pauseLabel, v.pauseIcon, 'border:3px solid ' + v.pauseBorder + ';background:transparent') +
    tool(v.clearTap, v.clearLabel, 'ph-fill ph-trash', 'border:3px solid ' + v.clearBorder + ';background:' + v.clearBg));

  start('bottom');
  paint('bottom',
    (v.showCats ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' + v.cats.map(c =>
      '<button type="button" ' + on(c.pick) + ' aria-label="' + esc(c.label) + '" style="height:56px;display:flex;align-items:center;gap:8px;padding:0 22px;cursor:pointer;font-family:var(--font-body);font-size:16px;font-weight:500;border-radius:999px;border:3px solid ' + c.border + ';background:' + c.bg + ';color:var(--color-text)">' + (CAT_PICS[c.label]
        ? '<span class="pic" aria-hidden="true" style="font-size:32px">' + CAT_PICS[c.label] + '</span>'
        : '<span class="pic" aria-hidden="true" style="font-size:22px;color:' + c.tint + '">' + ico(c.icon) + '</span>' + esc(c.label)) + '</button>').join('') + '</div>' : '') +
    (v.showElements ? '<div data-scroll="tiles" style="display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;-webkit-overflow-scrolling:touch">' + v.tiles.map(t =>
      '<button type="button" ' + on(t.pick) + ' aria-label="' + esc(t.label) + '" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;cursor:pointer;font-family:var(--font-body);width:78px;height:78px;flex-shrink:0;border-radius:var(--radius-lg);border:3px solid ' + t.border + ';background:' + t.bg + ';color:' + t.tint + ';transform:' + t.lift + ';transition:transform .12s">' + (PICS[t.label]
        ? '<span class="pic" aria-hidden="true">' + PICS[t.label] + '</span>'
        : '<span class="pic" aria-hidden="true" style="font-size:34px">' + ico(t.icon) + '</span><span style="font-size:12px;font-weight:500;color:var(--color-text)">' + esc(t.label) + '</span>') + '</button>').join('') + '</div>' : '') +
    (v.showColors ? '<div data-scroll="wells" style="display:flex;gap:14px;overflow-x:auto;padding:6px 4px 8px">' + v.wells.map(w =>
      '<button type="button" ' + on(w.pick) + ' aria-label="' + esc(w.name) + '" style="width:66px;height:66px;flex-shrink:0;border-radius:50%;padding:0;cursor:pointer;background:' + w.bg + ';border:2px solid var(--color-neutral-800);box-shadow:inset 0 -5px 8px rgba(0,0,0,.28);outline:' + w.ring + ';outline-offset:4px"></button>').join('') + '</div>' : ''));

  start('overlay');
  let ov = '';
  if (v.showPicker){
    ov += '<div style="position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:18px;padding:24px;background:color-mix(in srgb, var(--color-bg) 94%, transparent);overflow-y:auto">' +
      '<div style="display:flex;align-items:center;gap:14px">' +
      '<span class="pic" aria-hidden="true" style="font-size:34px;color:var(--color-accent)">🧩</span>' +
      '<div style="font-family:var(--font-heading);font-size:28px;font-weight:500;letter-spacing:-0.02em;flex:1">Välj bana</div>' +
      '<button type="button" ' + on(v.closePicker) + ' aria-label="Stäng" style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:50%;border:2px solid var(--color-neutral-700);background:transparent;color:var(--color-text)"><span class="pic" aria-hidden="true" style="font-size:26px">✕</span></button>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:14px">' +
      '<button type="button" ' + on(v.playFree) + ' style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;padding:12px;cursor:pointer;font-family:var(--font-body);border-radius:var(--radius-lg);border:3px solid var(--color-neutral-700);background:var(--color-neutral-900);color:var(--color-text)">' +
      '<span class="pic" aria-hidden="true" style="font-size:44px;color:var(--color-accent)">🖌️</span><span style="font-size:17px;font-weight:500">Fri lek</span></button>' +
      v.levelTiles.map(l =>
        '<button type="button" ' + on(l.pick) + ' style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;padding:12px;cursor:pointer;font-family:var(--font-body);border-radius:var(--radius-lg);border:3px solid ' + l.border + ';background:color-mix(in srgb, ' + l.tint + ' 14%, var(--color-neutral-900));color:var(--color-text)">' +
        '<span style="position:absolute;top:8px;left:12px;font-family:var(--font-heading);font-size:18px;color:var(--color-neutral-300)">' + esc(l.num) + '</span>' +
        (l.done ? '<span class="pic" role="img" aria-label="Klarad" style="position:absolute;top:8px;right:10px;font-size:24px;color:#f4c44e">⭐</span>' : '') +
        '<span class="pic" aria-hidden="true" style="font-size:44px;color:' + l.tint + '">' + ico(l.icon) + '</span>' +
        '<span style="font-size:16px;font-weight:500;text-align:center">' + esc(l.name) + '</span></button>').join('') +
      '</div></div>';
  }
  if (v.showWin){
    ov += '<div style="position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb, var(--color-bg) 60%, transparent)">' +
      '<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 32px;border-radius:var(--radius-lg);background:var(--color-neutral-900);border:1px solid var(--color-neutral-700);box-shadow:var(--shadow-lg)">' +
      '<span class="pic" aria-hidden="true" style="font-size:72px;color:#f4c44e">⭐</span>' +
      '<div style="font-family:var(--font-heading);font-size:30px;font-weight:500;letter-spacing:-0.02em">Bra jobbat!</div>' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">' +
      '<button type="button" class="pill" ' + on(v.openPicker) + ' style="border:2px solid var(--color-neutral-700);background:transparent"><span class="pic" aria-hidden="true" style="font-size:24px">🧩</span>Banor</button>' +
      (v.hasNext ? '<button type="button" class="pill" ' + on(v.nextLevel) + ' style="border:2px solid var(--color-accent);background:color-mix(in srgb, var(--color-accent) 20%, transparent)">Nästa bana<span class="pic" aria-hidden="true" style="font-size:22px">➡️</span></button>' : '') +
      '</div></div></div>';
  }
  paint('overlay', ov);
  handlers = next;
}

const app = new Component();
for (const name of ['hud', 'rail', 'bottom', 'overlay']) regions[name] = document.getElementById(name);
app.canvasRef.current = document.getElementById('cv');
app.wrapRef.current = document.getElementById('wrap');
app.nozzleRef.current = document.getElementById('nozzle');
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-h]');
  const fn = b && handlers[b.dataset.h];
  if (fn) fn();
});
// bakåtknappen till portalen: två tryck, så att ett finger som halkar inte lämnar spelet
const back = document.getElementById('back');
let backArm = false, backT;
const setBack = armed => {
  backArm = armed;
  back.style.borderColor = armed ? '#e5502a' : 'var(--color-neutral-700)';
  back.firstElementChild.textContent = armed ? '❓' : '⬅️';
};
back.addEventListener('pointerdown', e => e.stopPropagation());
back.addEventListener('click', e => {
  e.stopPropagation();
  clearTimeout(backT);
  if (backArm){ location.href = '../../index.html'; return; }
  setBack(true);
  backT = setTimeout(() => setBack(false), 2500);
});
// knappar och rutor skalar med skärmen: alla verktyg ska få plats på höjden utan att rulla.
// 910 = verktygsraden plus nedre fältet i grundstorlek, med lite marginal. Spelytan skalas inte, den fyller resten.
const scaled = [regions.rail, regions.bottom, regions.overlay, regions.hud, back];
const fit = () => {
  const s = Math.max(0.6, Math.min(1.6, window.innerHeight / 910, window.innerWidth / 700));
  for (const el of scaled) el.style.zoom = s;
};
window.addEventListener('resize', fit);
fit();
app.componentDidMount();
render();
</script>
