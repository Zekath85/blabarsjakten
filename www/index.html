<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Spelhörnan</title>
  <link rel="stylesheet" href="shared/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#15241d">
  <script type="module" src="shared/pwa.js"></script>
  <style>
    main { height: 100%; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; gap: 32px; }
    .games { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
    .game {
      width: 260px; padding: 18px; border-radius: 28px; text-align: center; text-decoration: none; color: var(--ink);
      background: var(--parchment); border: 6px solid var(--gold-2);
      box-shadow: 0 8px 0 var(--gold-dark), 0 16px 30px rgba(0, 0, 0, .4);
      transition: transform .1s;
    }
    .game:active { transform: translateY(5px) scale(.98); }
    .game .pic { height: 170px; border-radius: 18px; background: linear-gradient(#a5d76e, #5c9e3a); display: grid; grid-template-columns: 1fr 1fr; place-items: center; padding: 8px; }
    .game .pic svg { width: 72px; height: 72px; }
    .game h2 { margin: 14px 0 4px; font-size: 28px; }
    .game p { margin: 0; font-size: 18px; opacity: .8; }
    .soon { opacity: .5; pointer-events: none; }
    @media (max-width: 600px) { main { padding-top: 96px; } } /* plats för musikknappen ovanför rubriken */
    .soon .pic { background: linear-gradient(#cfc6b0, #a59a80); font-size: 80px; display: grid; place-items: center; grid-template-columns: 1fr; }
  </style>
</head>
<body>
  <!-- Musik av/på uppe till höger. Ligger ovanpå sidan, så rubriken står kvar i mitten. -->
  <button class="icon-btn" id="musicBtn" style="right:12px" aria-label="Musik av eller på"></button>
  <main>
    <h1 class="title">Spelhörnan</h1>
    <div class="games" id="games"></div>
  </main>
  <script type="module">
    import { ART } from './games/blabarsjakten/art.js';
    import { music } from './shared/music.js';
    import { MENU_SONG } from './shared/menu-song.js';
    import { settings } from './shared/audio.js';
    // Lugn menymusik direkt, eller vid första trycket om plattan kräver det.
    music.autostart(MENU_SONG);
    // Musikknappen: en not, med ett streck över när musiken är av.
    const note = '<path d="M15 30 V10 L32 6 V26" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="30" r="5" fill="#fff"/><circle cx="29" cy="26" r="5" fill="#fff"/>';
    const drawMusicBtn = () => (document.getElementById('musicBtn').innerHTML =
      `<svg viewBox="0 0 40 40">${note}${settings.get('music') ? '' : '<path d="M6 34 L34 6" stroke="#ff8a80" stroke-width="4.5" stroke-linecap="round"/>'}</svg>`);
    document.getElementById('musicBtn').onclick = () => {
      settings.set('music', !settings.get('music'));
      if (settings.get('music') && !music.playing) music.play(MENU_SONG);
      drawMusicBtn();
    };
    drawMusicBtn();
    // Nytt spel = en rad här + en mapp under games/.
    const GAMES = [
      { href: 'games/blabarsjakten/index.html', name: 'Blåbärsjakten', text: 'Samla flest blåbärskorgar!', pic: ['fox', 'owl', 'squirrel', 'hedgehog'].map(k => ART[k]).join('') },
    ];
    document.getElementById('games').innerHTML =
      GAMES.map(g => `<a class="game" href="${g.href}"><div class="pic">${g.pic}</div><h2>${g.name}</h2><p>${g.text}</p></a>`).join('') +
      `<div class="game soon"><div class="pic">?</div><h2>Fler spel</h2><p>Kommer snart…</p></div>`;
  </script>
</body>
</html>
